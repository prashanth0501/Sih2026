services:
  - type: web
    name: ignite-sih-api
    env: python
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: ignite_sih
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://sih2026.pages.dev", "http://localhost:5173"]'
